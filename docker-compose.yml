services:
  lit_api:
    build: .
    ports:
      - "${LIT_API_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    secrets:
      - libkey_api_key
      - ncbi_api_key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]

  streamlit:
    build: .
    entrypoint: streamlit
    command: run streamlit/ScopingReview_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "${LIT_STREAMLIT_PORT:-8501}:8501"
    environment:
      PYTHONUNBUFFERED: "1"
      LIT_ENDPOINT: http://lit_api:8000
    secrets:
      - azure_proxy_key
      - azure_proxy_endpoint
    depends_on:
      lit_api:
        condition: service_healthy

# Each secret takes exactly one source:
#   environment: (default) — Compose reads the variable from your shell or the
#     .env file (`cp .env.example .env` and fill in values). Names are lowercase
#     on purpose: they must match the secret name so the same .env also works
#     for host runs (`make run`) via manage_sensitive's env-var fallback.
#   file: — to use file-based secrets instead, comment the `environment:` line
#     and uncomment the `file:` line, pointing at your local path
#     (e.g. ./secrets/<name>.txt or a shared mount like /mnt/p/Secrets/<name>.txt).
secrets:
  libkey_api_key:
    environment: libkey_api_key
    # file: ./secrets/libkey_api_key.txt
  ncbi_api_key:
    environment: ncbi_api_key
    # file: ./secrets/ncbi_api_key.txt
  azure_proxy_key:
    environment: azure_proxy_key
    # file: ./secrets/azure_proxy_key.txt
  azure_proxy_endpoint:
    environment: azure_proxy_endpoint
    # file: ./secrets/azure_proxy_endpoint.txt

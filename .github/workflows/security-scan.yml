name: Security Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  security:
    uses: UABGH-Emerging-Technologies/ai_web_interface/.github/workflows/security-scan-reusable.yml@main
    with:
      package-manager: "pip"
      requirements-path: "code/requirements.txt"
      scan-path: "."
      python-version: "3.11"

  secret-content:
    # Content gate over every tracked file, not just paths. A git-filter-repo
    # --replace-text mapping (whose left-hand sides ARE the secrets) was once
    # committed under an obvious filename and passed a path-only review.
    # Stdlib-only, so no dependency install.
    name: Scan tracked content for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan all tracked files
        run: python tools/scan_secrets.py

  demo-fixtures:
    # The committed demo fixtures hold recorded prompt text and model output.
    # They must never contain a key. Stdlib-only, so no dependency install.
    name: Scrub demo fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan code/demo_fixtures for secret-shaped strings
        run: python code/capsule/scrub.py code/demo_fixtures
